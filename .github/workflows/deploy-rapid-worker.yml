name: Deploy Supabase rapid-worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/rapid-worker/**"
      - ".github/workflows/deploy-rapid-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy rapid-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy rapid-worker --project-ref dxbkzxvyqgsupdhlzmwv --yes
